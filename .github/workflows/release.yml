name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  # The full CI suite (build, tap self-check, gofmt, vet, race tests,
  # govulncheck) on the tagged commit: nothing is published from a commit
  # that does not pass it. Homebrew picks releases up automatically.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          gh release create "$TAG" --verify-tag --generate-notes
