name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: nastro-tap self-check
        run: make check-tap

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          echo "$fmt_out"
          test -z "$fmt_out"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...
