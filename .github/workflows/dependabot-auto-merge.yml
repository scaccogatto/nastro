name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Auto-merge (after the required checks pass) only patch updates, and
      # minor updates of dependencies already at 1.0 or later. Majors, minors
      # of 0.x dependencies (breaking under semver) and minors with no known
      # previous version wait for a human.
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
          steps.metadata.outputs.previous-version != '' &&
          !startsWith(steps.metadata.outputs.previous-version, '0.') &&
          !startsWith(steps.metadata.outputs.previous-version, 'v0.'))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
