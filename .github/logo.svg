<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <!-- cassette body -->
  <rect x="30" y="34" width="260" height="132" rx="18" fill="none" stroke="#8b919e" stroke-width="10"/>
  <!-- label line -->
  <line x1="66" y1="64" x2="254" y2="64" stroke="#8b919e" stroke-width="8" stroke-linecap="round"/>
  <!-- reels: left = REC dot (filled red), right = empty spool -->
  <circle cx="112" cy="112" r="26" fill="#e5484d"/>
  <circle cx="208" cy="112" r="24" fill="none" stroke="#8b919e" stroke-width="9"/>
  <!-- tape between reels -->
  <line x1="140" y1="112" x2="184" y2="112" stroke="#8b919e" stroke-width="8" stroke-linecap="round"/>
  <!-- wordmark -->
  <text x="160" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="44" font-weight="700" letter-spacing="6" fill="#8b919e">nastro</text>
</svg>
